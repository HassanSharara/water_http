[package]
name = "water_http"
version = "4.0.5"
edition = "2021"
authors = ["Hassan Sharara <hassansharara12@gmail.com>"]
repository = "https://github.com/HassanSharara/water_http"
homepage = "https://github.com/HassanSharara"
license = "MIT"
description = "fast web http framework that support http 1 and http 2 with very easy use"
categories = ["network-programming", "web-programming::http-server" ]
keywords = ["http", "water_http", "water-http","water-server"]
readme = "README.md"

default-run = "water_http"


[dependencies]
brotli = "7.0.0"
byteorder = "1.5.0"
bzip2 = "0.5.2"
flate2 = "1.1.9"
h2 = "0.4.18"
http = "1.5.0"
lz4 = "1.28.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
snap = "1.1.2"
tokio = { version = "1.53.1", features = ["full"] }
tokio-rustls = {version = "0.26.4",optional = true}
rustls = {version = "0.23.43" , optional = true}
rustls-pemfile = {version = "2.2.0" ,optional = true}
tracing = {version = "0.1.44",optional = true}
tracing-subscriber = {version = "0.3.23",optional = true,features = ["env-filter"]}
twoway = "0.2.2"
zstd = "0.13.3"
#pin-project = "1.1.10"
#path = "P:\\projects\\rust\\packages\\water_http_utils"
#chrono = "0.4.42"
itoa = "1.0.18"
httpdate = "1.0.3"
tokio-uring = {version = "0.5.0", optional = true}
bytes = "1.12.1"
integer_to_bytes = {version =  "0.2.2" }
core_affinity = {version = "0.8.3" , optional = true}
water_buffer = {version = "1.2.10" , features = ["bytes","unsafe_clone"]}
#water_http_utils = { version = "0.4.1-beta.10", features = ["server"],git = "https://github.com/HassanSharara/water_http_utils"}
water_http_utils = {version = "0.4.2",features = ["server"]}
smallbox = "0.8.8"
futures = "0.3.34"
urlencoding = "2.1.3"
#bytes = "1.11.0"


[[bin]]
name = "io_uring"
path = "src/io_uring_run.rs"
required-features = ["use_io_uring"]

[[bin]]
name = "water_http"
path = "src/main.rs"

[[example]]
name = "all_post_requests"
path = "examples/all_post_requests.rs"
required-features = []


[[example]]
name = "fast_start_server_shared"
path = "examples/fast_start_server_shared.rs"
required-features = ["thread_shared_struct"]


[[example]]
name = "all_post_requests_shared"
path = "examples/all_post_requests_shared.rs"
required-features = ["thread_shared_struct"]

[[example]]
name = "all_post_requests_shared_send_tls"
path = "examples/all_post_requests_shared_send_tls.rs"
required-features = ["thread_shared_struct","support_tls","use_tokio_send"]

[[example]]
name = "mini_server"
path = "examples/mini_server.rs"
required-features = ["mini"]

[[example]]
name = "lazy_response"
path = "examples/lazy_response.rs"
required-features = ["lazy_response"]


[[example]]
name = "lazy_response_interceptor"
path = "examples/lazy_response_interceptor.rs"
required-features = ["lazy_response"]


[features]
debugging = ["tracing","tracing-subscriber"]
count_connection_parsing_speed = ["tracing","tracing-subscriber"]
write_logs = ["water_http_utils/write_logs"]
support_tls = ["rustls","rustls-pemfile","tokio-rustls"]
use_only_http1 = []
accept_transfer_chunked = []
use_tokio_send = []
mini = []
lazy_response = []
thread_shared_struct = []
use_io_uring = ["tokio-uring","water_buffer/uring"]
cpu_affinity = ["dep:core_affinity"]
auto_encode_response = []
enable_dynamic_body_cache = []

[dev-dependencies]
askama = "0.14.0"



[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)','cfg(code_test)'] }
